minimumReleaseAge: 10080
blockExoticSubdeps: true
trustPolicy: no-downgrade
# Exact legacy releases whose newer lines have stronger registry attestations.
# Keeping these exceptions version-scoped prevents future downgrades from
# passing silently.
trustPolicyExclude:
  - 'undici-types@6.21.0'
  - 'chokidar@4.0.3'

overrides:
  serialize-javascript: '>=7.0.5'
  # form-data <4.0.6: CRLF injection via field names/filenames
  # (CVE-2026-12143, HIGH; axios transitive).
  'form-data': '>=4.0.6 <5'
  # zod <4.4.0: prototype pollution + missing input validation
  # (AIKIDO-2026-10706/-10707; @modelcontextprotocol/server transitive).
  # Raised to 4.6.0 for AIKIDO-2026-500926 and two related low advisories.
  'zod': '>=4.6.0 <5'
  # @toon-format/toon <2.3.1: prototype pollution (CVE-2026-82404, HIGH);
  # yaml <2.9.1: DoS (AIKIDO-2026-683761). Both incur transitives. These
  # overrides only shape our own lockfile; the matching floors are also
  # direct dependencies in package.json so npm consumers dedupe incur's
  # ^2.x requests up to the patched releases.
  '@toon-format/toon': '>=2.3.1 <3'
  'yaml': '>=2.9.1 <3'
  # js-yaml <4.3.2, brace-expansion, @humanfs/node: parser/ReDoS advisories in
  # the mocha / eslint dev tree.
  'js-yaml': '>=4.3.2 <5'
  'brace-expansion@^2': '>=2.1.7 <3'
  'brace-expansion@^5': '>=5.0.12 <6'
  '@humanfs/node': '>=0.16.8 <0.17'

allowBuilds:
  esbuild: true

# Kebab-cases camelCase flag names in incur's help/skill/example/CTA output.
# incur is pinned to an exact version in package.json while this patch is
# applied — upstream is converging on the same fix, so re-check (and ideally
# drop the patch) on every incur bump. As of 0.4.26 the option *definitions*
# render kebab-case upstream but examples, usage lines, CTAs and skill tables
# still emit the raw camelCase key, so all four sites remain patched.
patchedDependencies:
  incur@0.4.26: patches/incur@0.4.26.patch
